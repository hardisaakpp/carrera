[project]
name = "carrera"
version = "0.1.0"
description = "Hoja de vida como datos: YAML -> LaTeX -> PDF, base para búsqueda y ranking de empleos."
requires-python = ">=3.10"
dependencies = ["pydantic>=2.6", "pyyaml>=6.0", "jinja2>=3.1", "fastapi>=0.110", "uvicorn[standard]>=0.29"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
carrera = "carrera.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
carrera = ["templates/*.tex"]

[tool.pytest.ini_options]
testpaths = ["tests"]
